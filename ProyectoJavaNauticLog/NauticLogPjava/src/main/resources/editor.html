<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    .top-bar {
      background-color: #3b5998;
      color: white;
      padding: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .top-bar button {
      background-color: #1a1a2e;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
    }
    #editor-container {
      height: 400px;
      background: white;
      margin: 10px;
    }
  </style>
</head>
<body>
<div class="top-bar">
  <button onclick="addProduct()">Añadir productos</button>
  <button onclick="addSupply()">Añadir insumos</button>
  <button onclick="alert('Guardado')">Guardar</button>
  <button onclick="exportToPDF()">Exportar a PDF</button>
  <button onclick="javaConnector.volverAlMenu()">Volver al menú principal</button>
</div>

<div id="toolbar-container">
  <select class="ql-header">
    <option selected></option>
    <option value="1"></option>
    <option value="2"></option>
  </select>
  <button class="ql-bold"></button>
  <button class="ql-italic"></button>
  <button class="ql-underline"></button>
  <button class="ql-link"></button>
  <button class="ql-image"></button>
</div>
<div id="editor-container"></div>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>
  var quill = new Quill("#editor-container", {
    modules: { toolbar: "#toolbar-container" },
    theme: "snow"
  });

  function getHTML() {
    return quill.root.innerHTML;
  }

  function addProduct() {
    quill.clipboard.dangerouslyPasteHTML("<p><strong>Producto nuevo</strong>: Nombre, cantidad, descripción.</p>");
  }

  function addSupply() {
    quill.clipboard.dangerouslyPasteHTML("<p><strong>Insumo nuevo</strong>: Tipo, unidad, proveedor.</p>");
  }

  function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const html = quill.root.innerHTML;
    doc.text(html.replace(/<[^>]+>/g, ''), 10, 10);
    doc.save("documento.pdf");
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
